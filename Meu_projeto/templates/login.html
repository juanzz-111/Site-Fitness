{% extends "base.html" %}

{% block title %}
Login - Saúde & Bem-Estar
{% endblock %}

{% block content %}

<section class="login-container">

    <h1>Login</h1>

    <p class="subtitulo">
        Entre na sua conta
    </p>


    <form action="{{ url_for('login') }}" method="POST">

        <!-- USUÁRIO / E-MAIL -->

        <label for="usuario">
            Usuário ou e-mail:
        </label>

        <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Digite seu usuário ou e-mail"
            required
        >


        <!-- SENHA -->

        <label for="senha">
            Senha:
        </label>

        <div class="senha-container">

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button
                type="button"
                id="mostrar-senha"
                class="botao-olho"
                aria-label="Mostrar senha"
            >
                👁
            </button>

        </div>


        <!-- AVISO DE CAPS LOCK -->

        <p
            id="caps-lock"
            class="caps-lock"
            style="display: none;"
        >
            ⚠ Caps Lock está ativado.
        </p>


        <!-- DADOS DO PERFIL -->

        <h2>Dados do perfil</h2>

        <p class="descricao">
            Preencha seus dados para que eles apareçam no seu perfil.
        </p>


        <label for="nome">
            Nome:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
        >


        <label for="email">
            E-mail:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
        >


        <label for="idade">
            Idade:
        </label>

        <input
            type="number"
            id="idade"
            name="idade"
            min="1"
            required
        >


        <label for="peso">
            Peso (kg):
        </label>

        <input
            type="number"
            id="peso"
            name="peso"
            step="0.1"
            min="1"
            required
        >


        <label for="altura">
            Altura (m):
        </label>

        <input
            type="number"
            id="altura"
            name="altura"
            step="0.01"
            min="0.5"
            required
        >


        <label for="sexo">
            Sexo:
        </label>

        <select
            id="sexo"
            name="sexo"
            required
        >
            <option value="">Selecione</option>

            <option value="masculino">
                Masculino
            </option>

            <option value="feminino">
                Feminino
            </option>
        </select>


        <button type="submit" class="botao-login">
            Entrar
        </button>

    </form>

</section>


<script>

    // =====================================
    // MOSTRAR / OCULTAR SENHA
    // =====================================

    const senha = document.getElementById("senha");
    const botaoSenha = document.getElementById("mostrar-senha");

    botaoSenha.addEventListener("click", function () {

        if (senha.type === "password") {

            senha.type = "text";
            botaoSenha.textContent = "🙈";

        } else {

            senha.type = "password";
            botaoSenha.textContent = "👁";

        }

    });


    // =====================================
    // AVISO DE CAPS LOCK
    // =====================================

    const avisoCaps = document.getElementById("caps-lock");


    function verificarCapsLock(event) {

        if (event.getModifierState("CapsLock")) {

            avisoCaps.style.display = "block";

        } else {

            avisoCaps.style.display = "none";

        }

    }


    // Funciona mesmo antes de digitar
    senha.addEventListener("keydown", verificarCapsLock);

    senha.addEventListener("keyup", verificarCapsLock);

    senha.addEventListener("focus", function () {

        avisoCaps.style.display = "none";

    });

</script>

{% endblock %}
