{% extends "base.html" %}

{% block title %}
Login - Saúde & Bem-Estar
{% endblock %}

{% block content %}

  <main>

        <div class="login-container">

            <h1>Entrar na sua conta</h1>

            {% if erro %}
                <div class="erro">
                    {{ erro }}
                </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">

                <div class="campo">

                    <label for="email">Usuário/E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Usuário/E-mail"
                        value="{{ email or '' }}"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <div class="senha-box">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            onclick="mostrarSenha()"
                            id="olho"
                            aria-label="Mostrar senha"
                        >
                            👁
                        </button>

                    </div>

                    <div id="caps-aviso">
                        ⚠ Atenção: Caps Lock ativado!
                    </div>

                </div>

                <div class="esqueci">
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

                <div class="cadastro">
                  <span>Ainda não possui uma conta?</span>
                  <a href="{{ url_for('register') }}">Cadastre-se</a>
                </div>
                

            </form>

        </div>

    </main>

    <script>

        // Mostrar e ocultar senha
        function mostrarSenha() {

            const senha = document.getElementById("senha");
            const olho = document.getElementById("olho");

            if (senha.type === "password") {
                senha.type = "text";
                olho.textContent = "🙈";
            } else {
                senha.type = "password";
                olho.textContent = "👁";
            }
        }

        // Detector de Caps Lock
        const senha = document.getElementById("senha");
        const aviso = document.getElementById("caps-aviso");

        function verificarCapsLock(event) {

            const ativado = event.getModifierState("CapsLock");

            aviso.style.display = ativado ? "block" : "none";
        }

        senha.addEventListener("keydown", verificarCapsLock);
        senha.addEventListener("keyup", verificarCapsLock);

        senha.addEventListener("focus", function(event) {
            verificarCapsLock(event);
        });

        senha.addEventListener("blur", function() {
            aviso.style.display = "none";
        });

    </script>

{% endblock %}
