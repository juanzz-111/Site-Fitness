{% extends "base.html" %}

{% block title %}
Cadastro - Saúde & Bem-Estar
{% endblock %}

{% block content %}

<main class="pagina-cadastro">

    <div class="cadastro-container">

        <h1>Criar Nova Conta</h1>

        {% if erro %}
            <p class="mensagem erro">{{ erro }}</p>
        {% endif %}

        {% if sucesso %}
            <p class="mensagem sucesso">{{ sucesso }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="campo">

                <label for="nome">Nome Completo</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    value="{{ nome or '' }}"
                    required
                >

            </div>

            <div class="campo">

                <label for="email">Usuário / E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    value="{{ email or '' }}"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">Senha</label>

                <div class="senha-box">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                    <button type="button" onclick="mostrarSenha('senha')">
                        👁
                    </button>

                </div>

            </div>

            <div class="campo">

                <label for="confirmar_senha">Confirmar Senha</label>

                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>

            <!-- FOTO DE PERFIL -->
            <div class="campo">

                <label for="foto_perfil">Foto de Perfil (opcional)</label>

                <input
                    type="file"
                    id="foto_perfil"
                    name="foto_perfil"
                    accept=".png,.jpg,.jpeg,.webp"
                >

            </div>

            <div class="campo">

                <label for="funcao">Função</label>

                <select id="funcao" name="funcao">
                    <option value="comum" selected>Comum</option>
                </select>

            </div>

            <button type="submit" class="btn-cadastrar">
                Cadastrar Usuário
            </button>

        </form>

        <div class="login-link">
            Já possui conta?
            <a href="{{ url_for('login') }}">Entrar</a>
        </div>

    </div>

</main>

<script>

    function mostrarSenha(id) {

        const campo = document.getElementById(id);

        campo.type = campo.type === "password"
            ? "text"
            : "password";

    }

</script>

{% endblock content %}
