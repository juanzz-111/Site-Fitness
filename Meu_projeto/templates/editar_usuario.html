{% extends "base.html" %}

{% block title %}
Perfil - Saúde & Bem-Estar
{% endblock %}

{% block content %}


<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualizar Dados do Usuário</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/editar_perfil.css') }}">


    <main>

        <div class="editar-container">

            <h1>Atualizar Dados do Usuário</h1>

            <form action="{{ url_for('editar_perfil') }}" method="POST">

                <!-- E-MAIL -->
                <div class="campo">

                    <label for="email">Usuário / E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        required
                    >

                </div>

                <!-- SENHA -->
                <div class="campo">

                    <label for="senha">
                        Nova Senha (deixe em branco para manter)
                    </label>

                    <div class="senha-box">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite uma nova senha"
                        >

                        <button
                            type="button"
                            onclick="mostrarSenha()">
                            👁
                        </button>

                    </div>

                </div>

                <!-- FUNÇÃO -->
                <div class="campo">

                    <label for="funcao">Função</label>

                    <select id="funcao" name="funcao">
                        <option value="comum" selected>Comum</option>
                        <option value="admin">Administrador</option>
                    </select>

                </div>

                <!-- BOTÕES -->
                <div class="botoes">

                    <button type="submit" class="btn-salvar">
                        Salvar Alterações
                    </button>

                    <button
                        type="button"
                        class="btn-excluir"
                        onclick="confirmarExclusao()">
                        Excluir Conta
                    </button>

                </div>

            </form>

        </div>

    </main>

    <script>

        function mostrarSenha() {

            const senha = document.getElementById("senha");

            senha.type = senha.type === "password"
                ? "text"
                : "password";

        }

        function confirmarExclusao() {

            const confirmar = confirm(
                "Tem certeza que deseja excluir esta conta?"
            );

            if (confirmar) {
                alert("A exclusão ainda precisa ser implementada no Flask.");
            }

        }

    </script>

</body>
</html>


{% endblock %}
